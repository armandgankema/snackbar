<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<title>Bedankt | Snackmart</title>
</head>
<body>
<div class="wrap smal">
  <header class="top">
    <div>
      <div class="sub">Snackmart · Snackbar De Schalm</div>
      <h1 id="kop">Bedankt voor je bestelling</h1>
    </div>
  </header>
  <div class="panel" id="inhoud" hidden>
    <p id="tekst" style="margin-top:0"></p>
    <ul class="lines" id="lines"></ul>
    <div class="total" style="margin-top:10px"><span>Totaal</span><span id="total" class="num"></span></div>
    <p id="betaalTekst" style="margin-bottom:0"></p>
  </div>
  <p id="nietGevonden" class="notice" hidden>Deze bestelling is niet gevonden. Misschien is hij verwijderd door de beheerder.</p>
  <div class="row">
    <a class="btn btn-ghost" href="/">Terug naar het menu</a>
    <a class="btn btn-ghost" href="overzicht.html">Wie heeft er al besteld?</a>
  </div>
</div>
<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  function eur(c) { return "€ " + (c / 100).toFixed(2).replace(".", ","); }
  var id = new URLSearchParams(location.search).get("id");
  fetch("/api/bestelling?id=" + encodeURIComponent(id || "")).then(function (r) { if (!r.ok) throw 0; return r.json(); }).then(function (b) {
    var p = b.week.split("-"), maanden = ["januari","februari","maart","april","mei","juni","juli","augustus","september","oktober","november","december"];
    $("tekst").textContent = b.naam + ", je bestelling voor vrijdag " + (+p[2]) + " " + maanden[p[1] - 1] + " is geplaatst:";
    b.regels.forEach(function (r) {
      var li = document.createElement("li"); li.className = "line";
      var a = document.createElement("span"); a.className = "ln"; a.textContent = r.omschrijving;
      var pr = document.createElement("span"); pr.className = "pr num"; pr.textContent = eur(r.prijs);
      li.appendChild(a); li.appendChild(pr); $("lines").appendChild(li);
    });
    $("total").textContent = eur(b.totaal);
    $("betaalTekst").textContent = b.betaalwijze === "contant"
      ? "Je betaalt " + eur(b.totaal) + " contant aan de verzamelaar."
      : "Je ontvangt een betaalverzoek van " + eur(b.totaal) + ".";
    $("inhoud").hidden = false;
  }).catch(function () { $("kop").textContent = "Bestelling niet gevonden"; $("nietGevonden").hidden = false; });
})();
</script>
</body>
</html>
